name: CI Frontend

on:
  pull_request:
    paths:
      - 'src/frontend/**'
      - '.github/workflows/ci-frontend.yml'
      - 'ci/github-actions/ci-frontend.yml'
  push:
    branches: [main]
    paths:
      - 'src/frontend/**'

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: src/frontend/ulp-web

    steps:
      - uses: actions/checkout@v4

      - name: Setup Node 20
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: src/frontend/ulp-web/package-lock.json

      - name: Install
        run: npm ci

      - name: Build (production)
        run: npm run build:prod

      - name: Test
        run: npm run test -- --watch=false --browsers=ChromeHeadless --code-coverage

      - name: Upload dist
        if: github.ref == 'refs/heads/main'
        uses: actions/upload-artifact@v4
        with:
          name: ulp-web-dist
          path: src/frontend/ulp-web/dist/
