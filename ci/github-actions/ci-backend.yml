name: CI Backend

on:
  pull_request:
    paths:
      - 'src/backend/**'
      - '.github/workflows/ci-backend.yml'
      - 'ci/github-actions/ci-backend.yml'
  push:
    branches: [main]
    paths:
      - 'src/backend/**'

permissions:
  contents: read
  pull-requests: write

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-test:
    runs-on: ubuntu-latest

    services:
      mysql:
        image: mysql:8.0
        env:
          MYSQL_ROOT_PASSWORD: testpw
          MYSQL_DATABASE: ulp_test
        ports: ['3306:3306']
        options: >-
          --health-cmd="mysqladmin ping -h localhost -u root -ptestpw"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=10

    steps:
      - uses: actions/checkout@v4

      - name: Setup .NET 8
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'

      - name: Cache NuGet
        uses: actions/cache@v4
        with:
          path: ~/.nuget/packages
          key: ${{ runner.os }}-nuget-${{ hashFiles('src/backend/**/*.csproj', 'src/backend/Directory.Packages.props') }}
          restore-keys: ${{ runner.os }}-nuget-

      - name: Restore
        working-directory: src/backend
        run: dotnet restore Ulp.sln

      - name: Build
        working-directory: src/backend
        run: dotnet build Ulp.sln --configuration Release --no-restore

      - name: Test
        working-directory: src/backend
        run: >
          dotnet test Ulp.sln
          --configuration Release
          --no-build
          --logger "trx"
          --collect:"XPlat Code Coverage"

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: backend-test-results
          path: '**/TestResults/**'
