# nginx config for the beta Angular SPA. Mounted into the web container at
# /etc/nginx/conf.d/default.conf.
#
# - Fingerprinted assets (Angular's hash filenames) get a 1-year immutable cache.
# - Anything else (index.html, runtime config files) is no-store so a release
#   pushes through immediately.
# - SPA fallback to index.html so deep-link refreshes don't 404.

server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    location ~* \.(js|css|woff2?|ttf|eot|svg|png|jpg|jpeg|gif|ico)$ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        try_files $uri =404;
    }

    location / {
        add_header Cache-Control "no-store" always;
        try_files $uri $uri/ /index.html;
    }
}
