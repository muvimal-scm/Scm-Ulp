apiVersion: 1
# Tells Grafana where to find dashboard JSON definitions on disk.

providers:
  - name: 'ULP Beta'
    orgId: 1
    folder: 'ULP Beta'
    type: file
    disableDeletion: false
    updateIntervalSeconds: 30
    allowUiUpdates: true
    options:
      path: /var/lib/grafana/dashboards
      foldersFromFilesStructure: false
